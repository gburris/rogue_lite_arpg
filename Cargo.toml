[package]
name = "baba_yaga"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
description = "Baba Yaga is a 2D action RPG about a witch who wants to eat you."

[dependencies]
bevy = { version = "0.19.1", default-features = false, features = [
    "2d",
    "ui",
    "bevy_feathers",
    "webgpu",
] }
bevy_ecs_tilemap = "0.19.0"
bevy_asset_loader = { version = "0.27.0", features = ["2d"] }
bevy_enhanced_input = "0.26.0"
bevy_lit = "0.11"
bevy_tweening = "0.16.0"
accesskit = "0.24.0"
avian2d = "0.7.0"
rand = "0.10.2"
rand_chacha = "0.10"
ron = "0.12.0"
serde = "1.0.229"
tracing = "0.1.44"
# Plots in Tracy; the same crate that Bevy's `trace_tracy` uses.
tracy-client = { version = "0.18.3", optional = true }
bevy_mod_debugdump = { version = "0.16", default-features = false, optional = true }
clap = { version = "4.6.7", features = ["derive"], optional = true }
# CPU name for the stress summary line; the same version Bevy's `sysinfo_plugin` uses.
sysinfo = { version = "0.38.4", default-features = false, features = ["system"], optional = true }

[target.wasm32-unknown-unknown.dependencies]
getrandom = { version = "0.4.3", features = ["wasm_js"] }

[features]
# Default to a native dev build.
default = ["dev_native"]
dev = [
    # Improve compile times for dev builds by linking Bevy as a dynamic library.
    "bevy/dynamic_linking",
    "bevy/bevy_dev_tools",
    "bevy/bevy_ui_debug",
    # CPU and memory usage diagnostics for the F3 overlay (`dev/hud.rs`).
    "bevy/sysinfo_plugin",
    # Improve error messages coming from Bevy
    "bevy/track_location",
    "bevy/debug",
    # Dump schedule graphs to DOT files (see `dev/schedule_dump.rs`).
    "dep:bevy_mod_debugdump",
    "stress",
]
dev_native = [
    "dev",
    # Enable asset hot reloading for native dev builds.
    "bevy/file_watcher",
    # Enable embedded asset hot reloading for native dev builds.
    "bevy/embedded_watcher",
]
# Compile out low-severity logs and spans. Enabled by the bevy_cli release builds, and left off
# for profiling since it would also remove Bevy's system spans from Tracy captures.
# (see <https://github.com/bevyengine/bevy/blob/main/docs/profiling.md#tracy-profiler>)
strip_logs = ["tracing/max_level_debug", "tracing/release_max_level_warn"]
# Lets `--stress` start the game in the stress arena with an invincible player.
stress = ["dep:clap", "dep:sysinfo"]
# Stream spans to Tracy. Build with `--profile profiling --no-default-features`.
tracy = ["bevy/trace_tracy", "bevy/debug", "dep:tracy-client", "stress"]

[package.metadata.bevy_cli.release]
# Disable dev features for release builds.
default-features = false
features = ["strip_logs"]

[package.metadata.bevy_cli.web]
# Disable native features for web builds.
default-features = false

[package.metadata.bevy_cli.web.dev]
features = ["dev"]

[workspace]
members = ["xtask"]

[lints]
workspace = true

[workspace.lints.rust]
unsafe_code = "forbid"
# Mark `bevy_lint` as a valid `cfg`, as it is set when the Bevy linter runs.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(bevy_lint)"] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Bevy supplies arguments to systems via dependency injection, so it's natural for systems to
# request more than 7 arguments, which would undesirably trigger this lint.
too_many_arguments = "allow"
# Queries may access many components, which would undesirably trigger this lint.
type_complexity = "allow"
# Make sure macros use their standard braces, such as `[]` for `bevy_ecs::children!`.
nonstandard_macro_braces = "warn"
# Field names often repeat the struct name for clarity (`Mana::max_mana`, `GameIcons::*_icon`).
struct_field_names = "allow"
# Use `expect` with a message describing the failure instead.
unwrap_used = "warn"
# Every assert states why it must hold.
missing_assert_message = "warn"
needless_pass_by_value = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
missing_panics_doc = "allow"
missing_errors_doc = "allow"
cast_sign_loss = "allow"
# Keep the `mod.rs` layout: a module with children lives in `foo/mod.rs`, not `foo.rs`.
self_named_module_files = "warn"
# Use `Self` instead of repeating the type name inside its own impl.
use_self = "warn"
# Format arguments are inlined into the string where possible (`{entity:?}`).
uninlined_format_args = "warn"
# Silence a lint with `#[expect]`, so a stale suppression is reported.
allow_attributes = "warn"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1
split-debuginfo = "unpacked"

# Remove expensive debug assertions due to <https://github.com/bevyengine/bevy/issues/14291>
[profile.dev.package.wgpu-types]
debug-assertions = false

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.build-override]
opt-level = 3

[profile.release]
# Compile the entire crate as one unit.
# Slows compile times, marginal improvements.
codegen-units = 1
# Do a second optimization pass over the entire program, including dependencies.
# Slows compile times, marginal improvements.
lto = "thin"

# Release speed with symbols, for Tracy and samply captures.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"

# This profile will be used by `bevy run web` automatically.
[profile.web-release]
# Default to release profile values.
inherits = "release"
# Optimize with size in mind (also try "z", sometimes it is better).
# Slightly slows compile times, great improvements to file size and runtime performance.
opt-level = "s"
# Strip all debugging information from the binary to slightly reduce file size.
strip = "debuginfo"

# Optimize for build time in CI.
[profile.ci]
inherits = "dev"
opt-level = 0
debug = "line-tables-only"
codegen-units = 4

[profile.ci.package."*"]
opt-level = 0
