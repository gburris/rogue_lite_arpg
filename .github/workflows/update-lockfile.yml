name: Update lockfile

# Brings Cargo.lock in line with Cargo.toml on branches, for sessions that can't reach crates.io.
# Pushes from this workflow use GITHUB_TOKEN, so they don't start CI themselves: push another
# commit (or re-push) afterwards to run CI against the new lockfile.
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-lockfile:
    name: Update lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Update Cargo.lock
        run: |
          # The rust-toolchain.toml nightly isn't needed just to resolve dependencies.
          export RUSTUP_TOOLCHAIN=stable
          cargo update --workspace
          # Follow the latest commit of git dependencies such as bevy_firefly.
          cargo update bevy_firefly || true
          git diff --stat

      - name: Commit Cargo.lock
        run: |
          if git diff --quiet Cargo.lock; then
            echo "Cargo.lock is up to date"
            exit 0
          fi
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "Update Cargo.lock"
          git push
